[package]
name = "p3r-calendar-sync"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
ical = "0.11"
rrule = { version = "0.14", features = ["exrule"] }
windows-timezones = { version = "0.5", features = ["chrono-tz"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
rpassword = "7"
iana-time-zone = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
